<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · FixFlow</title><script src="/__hatchable/auth.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8fb;color:#171a2d;font-family:Inter,system-ui,sans-serif;padding:20px}.card{max-width:430px;width:100%;padding:32px;border:1px solid #e7e8f0;border-radius:18px;background:white;box-shadow:0 20px 70px #20244710}.brand{font-weight:850;font-size:26px;margin-bottom:24px}.brand span{color:#7766ff}h1{font-size:23px;margin:0 0 8px}p{color:#777d91;font-size:14px;line-height:1.5;margin:0 0 24px}label{font-size:13px;font-weight:650}input,button{font:inherit;width:100%;height:46px;border-radius:9px;margin-top:9px;padding:0 12px}input{border:1px solid #dfe2ed}button{border:0;background:#7766ff;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#back{background:white;color:#4b4f62;border:1px solid #e0e2ed}#codeWrap[hidden],#back[hidden]{display:none}#msg{min-height:22px;color:#b42318;font-size:13px;margin-top:12px}</style></head><body><main class="card"><div class="brand">fixflow<span>.</span></div><h1 id="title">Sign in or create your account</h1><p id="subtitle">Enter your email to receive a one-time verification code.</p><form id="form"><label>Email address<input id="email" type="email" autocomplete="username webauthn" required placeholder="you@company.com"></label><label id="codeWrap" hidden>Verification code<input id="code" autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="6-digit code"></label><button id="submit">Send sign-in code</button><button id="back" type="button" hidden>Use a different email</button></form><div id="msg" role="status"></div></main><script>(function(){const A=window.hatchable&&window.hatchable.auth,form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),wrap=document.getElementById('codeWrap'),submit=document.getElementById('submit'),back=document.getElementById('back'),msg=document.getElementById('msg');let stage=0,sent='';if(!A){msg.textContent='Sign-in is unavailable. Refresh the page.';submit.disabled=true;return}A.getSession().then(s=>{if(s&&s.user)location.replace('/')}).catch(()=>{});form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;msg.textContent='';try{if(stage===0){sent=email.value.trim().toLowerCase();await A.startLogin({email:sent});stage=1;email.readOnly=true;wrap.hidden=false;back.hidden=false;code.required=true;submit.textContent='Verify and continue';document.getElementById('title').textContent='Check your email';document.getElementById('subtitle').textContent='Enter the one-time code sent to '+sent;code.focus()}else{await A.verifyCode({email:sent,code:code.value.trim()});const r=await fetch('/api/profile');const d=await r.json();if(!r.ok)throw Error(d.error||'Profile setup failed');location.replace('/')}}catch(err){msg.textContent=err.message||'Sign-in failed'}finally{submit.disabled=false}});back.onclick=()=>{stage=0;email.readOnly=false;wrap.hidden=true;back.hidden=true;code.required=false;code.value='';submit.textContent='Send sign-in code';document.getElementById('title').textContent='Sign in or create your account';document.getElementById('subtitle').textContent='Enter your email to receive a one-time verification code.';msg.textContent=''}})();</script></body></html>
